id: app-immich
kind: app
title: Immich
summary: Your own Google Photos - phone backup, timeline, albums, faces and search.
category: media
purpose: |
  Backs up the photos and videos from everyone's phones and shows them in a
  fast timeline with albums, sharing, maps, face recognition and search by
  what's in the picture. Everything is processed on your server.

  Machine learning (faces, search) needs a few GB of memory; give the host
  at least 6 GB. The photo folder should be on a big disk that's backed up.
library: [apps/immich, guides/family-cloud-photos]
stacks:
  - name: immich
    compose: |
      services:
        immich-server:
          image: ghcr.io/immich-app/immich-server:release
          container_name: immich_server
          restart: unless-stopped
          ports:
            - "2283:2283"
          environment:
            TZ: ${TZ}
            DB_HOSTNAME: database
            DB_USERNAME: postgres
            DB_PASSWORD: ${DB_PASSWORD}
            DB_DATABASE_NAME: immich
            REDIS_HOSTNAME: redis
          volumes:
            - ${UPLOAD_LOCATION}:/data
            - /etc/localtime:/etc/localtime:ro
          depends_on:
            - redis
            - database

        immich-machine-learning:
          image: ghcr.io/immich-app/immich-machine-learning:release
          container_name: immich_machine_learning
          restart: unless-stopped
          volumes:
            - model-cache:/cache

        redis:
          image: docker.io/valkey/valkey:8-bookworm
          container_name: immich_redis
          restart: unless-stopped

        database:
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          container_name: immich_postgres
          restart: unless-stopped
          shm_size: 128mb
          environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: immich
            POSTGRES_INITDB_ARGS: "--data-checksums"
          volumes:
            - ./postgres:/var/lib/postgresql/data

      volumes:
        model-cache:
    env:
      - name: UPLOAD_LOCATION
        label: Folder for photos and videos
        default: /srv/photos
        path: true
        help: On the big disk. Immich keeps originals, thumbnails and encoded videos here.
      - name: TZ
        label: Time zone
        default: Etc/UTC
      - name: DB_PASSWORD
        label: Database password
        secret: true
        generate: true
        help: Leave empty to generate one (letters and digits only, as Immich asks).
    ports:
      - { port: 2283/tcp, what: Immich }
firewall:
  allow: [2283/tcp]
manual:
  - title: Create the admin account
    detail: Open http://<host>:2283; the first account becomes the admin. Then install the Immich app on phones and point it at the same address.
  - title: Back up the photos and the database
    detail: Back up the photo folder and use Immich's own database dumps (Administration → Settings → Backup); copying the postgres folder of a running database isn't a backup.
