[package]
name = "nightgrid"
description = "NIGHTGRID — homelab command center"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "nightgrid"

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows.
name = "nightgrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
nightgrid-core = { path = "../core", features = ["specta"] }
nightgrid-llm = { path = "../llm" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
base64 = "0.23.1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
time = { version = "0.3", features = ["formatting"] }
zeroize = "1.9.1"
