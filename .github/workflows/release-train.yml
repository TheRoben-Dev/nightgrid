name: Release train

# Batched releases (D-185). Every push to main starts this run and cancels
# the one before it, so it only goes past the quiet window once main has
# been still for a while. Then, when anything beyond the interface, docs or
# CI changed since the last release, it picks the next version (minor when
# the CHANGELOG's Unreleased notes have "### Added", else patch), commits
# and tags it on main and starts the CI release run for that tag. Fixes
# merged close together (or while a release builds) leave as one release.
# PRs never bump versions, so versions can't collide.
#
# Interface-only fixes ship sooner as signed UI patches (ui-patch.yml);
# Library-only changes as content packs (kb-content.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      now:
        description: "Skip the quiet window"
        type: boolean
        default: true

concurrency:
  group: release-train
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  train:
    name: Release main's version when it's new
    runs-on: ubuntu-latest
    permissions:
      # Commits the version and pushes its tag.
      contents: write
      # Starts ci.yml (a workflow_dispatch from GITHUB_TOKEN does run).
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Minutes main must stay still before a release starts (repository
      # variable RELEASE_QUIET_MINUTES, default 10). A new push cancels this
      # run and starts the wait again.
      - name: Quiet window
        if: github.event_name == 'push' || !inputs.now
        run: sleep $(( ${{ vars.RELEASE_QUIET_MINUTES || 10 }} * 60 ))

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # One release at a time: a run already building finishes first.
      - name: Wait for a running release
        run: |
          for _ in $(seq 1 120); do
            n=$(gh run list --workflow ci.yml --event workflow_dispatch --limit 20 --json status \
              --jq '[.[] | select(.status != "completed")] | length')
            [ "$n" = "0" ] && exit 0
            echo "a release run is still going ($n); waiting"
            sleep 30
          done
          echo "::error::a release run has been going for an hour"; exit 1

      # A tag whose release never got published (a failed build) is retried.
      - name: Unfinished release?
        id: retry
        run: |
          git fetch -q --tags origin
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$last" ] && ! gh release view "$last" >/dev/null 2>&1; then
            echo "$last is tagged but has no release: building it again."
            echo "tag=$last" >> "$GITHUB_OUTPUT"
          fi

      # The train picks the version (scripts/release-version.mjs): PRs only
      # add notes under "## [Unreleased]" in CHANGELOG.md.
      - name: Pick the version
        id: v
        if: steps.retry.outputs.tag == ''
        run: |
          out=$(node scripts/release-version.mjs)
          echo "$out"
          echo "release=$(echo "$out" | jq -r .release)" >> "$GITHUB_OUTPUT"
          echo "tag=$(echo "$out" | jq -r '.tag // empty')" >> "$GITHUB_OUTPUT"

      - name: Commit and tag the version
        if: steps.v.outputs.release == 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -qam "release: $TAG"
          fi
          git tag "$TAG"
          # Pushes made with this token start no workflows, so no loop.
          git push origin HEAD:main "refs/tags/$TAG"

      - name: Start the release
        if: steps.v.outputs.release == 'true' || steps.retry.outputs.tag != ''
        env:
          TAG: ${{ steps.retry.outputs.tag || steps.v.outputs.tag }}
        run: |
          # On main so the build's caches are main's; the run checks out the tag.
          gh workflow run ci.yml --ref main -f release_tag="$TAG"
          echo "### Release $TAG started" >> "$GITHUB_STEP_SUMMARY"
          echo "Started the CI release run for $TAG."
