name: CI

on:
  push:
    branches: [main]
    # A v* tag also publishes the installers as a GitHub prerelease.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
    libssl-dev libdbus-1-dev patchelf file xdg-utils

jobs:
  checks:
    name: Lint & test (frontend + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: svelte-check
        run: pnpm check
      - name: eslint
        run: pnpm lint
      - name: vitest
        run: pnpm test
      - name: Frontend build
        run: pnpm build

      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: OpenSSH server for integration tests
        run: sudo apt-get install -y openssh-server && sudo mkdir -p /run/sshd
      - name: cargo test
        run: cargo test --workspace --locked
        env:
          NIGHTGRID_TEST_OPENSSH: "1"
          # Docker-over-SSH test against the runner's own dockerd.
          NIGHTGRID_TEST_DOCKER: "1"
      - name: TS bindings are up to date
        run: git diff --exit-code -- ui/src/lib/bindings.ts || (echo "::error::ui/src/lib/bindings.ts is stale. Run 'cargo test -p nightgrid --lib bindings' and commit." && exit 1)

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
          - name: macos-arm64
            os: macos-latest
            bundles: app,dmg
          - name: linux-x64
            os: ubuntu-latest
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # Core logic (SQLite, settings, secrets wrapper) on every OS.
      - name: cargo test (core)
        run: cargo test -p nightgrid-core --locked
        env:
          # Real-sshd tests: macOS ships sshd; Linux is covered by the checks job.
          NIGHTGRID_TEST_OPENSSH: ${{ matrix.name == 'macos-arm64' && '1' || '0' }}

      - name: Tauri build
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/nightgrid.exe -DestinationPath target/release/bundle/nightgrid-portable-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nightgrid-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/*.zip
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  release:
    name: Prerelease (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List installers
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*

