name: CI

on:
  push:
    branches: [main]
    # A v* tag also publishes the installers as a GitHub prerelease.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a prerelease with this tag (e.g. v0.3.0); empty = just build"
        required: false
        default: ""

# A release run (manual or from the release train) gets a group of its own
# that is never cancelled, so merging to main while a release builds is safe.
# Everything else: a newer push to the same ref replaces the running one.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') && format('release-{0}', inputs.release_tag) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Release runs build from main, which the checks job and every PR's
  # platform builds have already tested.
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v')) }}
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
    libssl-dev libdbus-1-dev patchelf file xdg-utils

jobs:
  checks:
    name: Lint & test (frontend + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # man-db's index rebuild after each package was most of the old 7-8 min.
      - name: Install Linux build deps
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends $LINUX_DEPS

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Only main saves caches: PR caches can't be reused by other branches
      # and would push main's out of the 10 GB cache budget.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: svelte-check
        run: pnpm check
      - name: eslint
        run: pnpm lint
      - name: vitest
        run: pnpm test
      - name: Frontend build
        run: pnpm build

      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: OpenSSH server for integration tests
        run: sudo apt-get install -y openssh-server && sudo mkdir -p /run/sshd
      # A tiny pinned model for the llama.cpp inference test (the app's own
      # model is 2.5 GB and only downloaded on the user's machine).
      - name: Test model (cache)
        uses: actions/cache@v4
        with:
          path: ~/test-models
          key: llm-qwen3-0.6b-q4_0-afe8ad35
      - name: Test model (download + verify)
        run: |
          mkdir -p ~/test-models && cd ~/test-models
          f=Qwen3-0.6B-Q4_0.gguf
          sum=da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4
          if ! echo "$sum  $f" | sha256sum -c --quiet 2>/dev/null; then
            curl -fsSL --retry 3 -o "$f" "https://huggingface.co/ggml-org/Qwen3-0.6B-GGUF/resolve/afe8ad3577aa22500b3cd1c880f153b3b0e1cae8/$f"
            echo "$sum  $f" | sha256sum -c
          fi
      - name: cargo test
        run: cargo test --workspace --locked
        env:
          NIGHTGRID_TEST_LLM_MODEL: /home/runner/test-models/Qwen3-0.6B-Q4_0.gguf
          NIGHTGRID_TEST_OPENSSH: "1"
          # Docker-over-SSH test against the runner's own dockerd.
          NIGHTGRID_TEST_DOCKER: "1"
      - name: TS bindings are up to date
        run: git diff --exit-code -- ui/src/lib/bindings.ts || (echo "::error::ui/src/lib/bindings.ts is stale. Run 'cargo test -p nightgrid --lib bindings' and commit." && exit 1)

  # Builds run beside the checks instead of after them; the release job
  # still needs both. Pushes to main skip them: PRs already built every
  # platform and the release train's run builds main again.
  build:
    name: Build (${{ matrix.name }})
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
          - name: macos-arm64
            os: macos-latest
            bundles: app,dmg
          - name: linux-x64
            os: ubuntu-latest
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends $LINUX_DEPS

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' || env.IS_RELEASE == 'true' }}

      # Core logic (SQLite, settings, secrets wrapper) on every OS.
      - name: cargo test (core)
        if: env.IS_RELEASE != 'true'
        run: cargo test -p nightgrid-core --locked
        env:
          # Real-sshd tests: macOS ships sshd; Linux is covered by the checks job.
          NIGHTGRID_TEST_OPENSSH: ${{ matrix.name == 'macos-arm64' && '1' || '0' }}

      # Built-in Tailscale (M10j): a Go sidecar bundled next to the app.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum
      - name: Tailnet sidecar
        shell: bash
        working-directory: tailnet
        run: |
          go vet ./...
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p ../app/binaries
          # Static on Windows/Linux; macOS keeps cgo for the system resolver.
          if [ "$RUNNER_OS" != "macOS" ]; then export CGO_ENABLED=0; fi
          go build -tags ts_omit_logtail -trimpath -ldflags "-s -w" -o "../app/binaries/nightgrid-tailnet-$triple$ext" .
          ls -la ../app/binaries

      # A runner CMake upgrade breaks cached C/C++ build dirs (llama.cpp):
      # their CMakeCache points at the old CMake's modules. Drop those dirs.
      - name: Drop stale CMake build dirs
        shell: bash
        run: |
          ver=$(cmake --version | sed -n 's/^cmake version \([0-9]*\.[0-9]*\).*/\1/p')
          # Newer cargo nests build dirs one level deeper (build/<pkg>/<hash>/out), so search.
          find target -path '*/out/build/CMakeCache.txt' 2>/dev/null | while read -r c; do
            if ! grep -q "^CMAKE_ROOT:INTERNAL=.*cmake-$ver" "$c" && ! grep -q "^CMAKE_ROOT:INTERNAL=.*/share/cmake$" "$c"; then
              echo "dropping $(dirname "$c") (not CMake $ver)"
              rm -rf "$(dirname "$c")"
            fi
          done

      - name: Tauri build
        shell: bash
        env:
          # Signs updater bundles when the key is configured; builds stay
          # unsigned (and without self-update artifacts) otherwise.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true,"externalBin":["binaries/nightgrid-tailnet"]}}'
          else
            pnpm tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"externalBin":["binaries/nightgrid-tailnet"]}}'
          fi

      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/nightgrid.exe,target/release/nightgrid-tailnet.exe -DestinationPath target/release/bundle/nightgrid-portable-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nightgrid-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/*.zip
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig

  release:
    name: Release (tags / manual)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Updater manifest
        run: node scripts/updater-manifest.mjs dist "${{ inputs.release_tag || github.ref_name }}" dist/latest.json
      - name: Require signed updates
        # With a public key in the app, a release without latest.json would
        # leave installed copies unable to update: fail instead.
        run: |
          if [ -s app/updater.pub ] && [ ! -f dist/latest.json ]; then
            echo "::error::app/updater.pub is set but no signed updater bundles were built. Check the TAURI_SIGNING_PRIVATE_KEY secrets."
            exit 1
          fi
      - name: List installers
        run: ls -laR dist
      - uses: softprops/action-gh-release@v2
        with:
          # Not marked prerelease: the updater reads releases/latest, which skips prereleases.
          prerelease: false
          make_latest: true
          # Tag pushes use their tag; a manual run creates `release_tag` on the built commit.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          # Artifacts keep their bundle subfolders (dmg/, nsis/, deb/...).
          files: dist/**/*

