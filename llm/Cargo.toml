[package]
name = "nightgrid-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Local LLM runtime for the Nightgrid helper (llama.cpp)"

[dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false }
encoding_rs = "0.8"
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal"] }
