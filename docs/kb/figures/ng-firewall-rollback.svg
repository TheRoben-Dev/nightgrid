las,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">firewalld rules</text><path d="M367.5,52 L385.5,70 L367.5,88 L349.5,70 Z" fill="#07080B" stroke="#FF2A6D" stroke-width="2"/><text x="367.5" y="75" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#FF2A6D" text-anchor="middle" font-weight="700">02</text><text x="367.5" y="116" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16" fill="#E6EDF3" text-anchor="middle" font-weight="700">Change</text><text x="367.5" y="140" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">Add or remove a rule;</text><text x="367.5" y="157" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">Nightgrid arms a 1, 2 or</text><text x="367.5" y="174" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">5 min timer on the host</text><path d="M592.5,52 L610.5,70 L592.5,88 L574.5,70 Z" fill="#07080B" stroke="#00E5FF" stroke-width="2"/><text x="592.5" y="75" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#00E5FF" text-anchor="middle" font-weight="700">03</text><text x="592.5" y="116" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16" fill="#E6EDF3" text-anchor="middle" font-weight="700">Test</text><text x="592.5" y="140" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">A fresh SSH connection</text><text x="592.5" y="157" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">proves you still get in</text><path d="M817.5,52 L835.5,70 L817.5,88 L799.5,70 Z" fill="#07080B" stroke="#FF9F1C" stroke-width="2"/><text x="817.5" y="75" font-family="'JetBrains Mono',Menlo,