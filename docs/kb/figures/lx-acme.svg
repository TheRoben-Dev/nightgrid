<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 234" width="960" height="234"><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 H0 V24" fill="none" stroke="#11161F" stroke-width="1"/></pattern><linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#07080B" stop-opacity="0.95"/><stop offset="0.55" stop-color="#07080B" stop-opacity="0.2"/><stop offset="1" stop-color="#07080B" stop-opacity="0"/></linearGradient></defs><rect width="960" height="234" fill="#07080B"/><rect width="960" height="234" fill="url(#g)"/><rect x="0" y="0" width="960" height="26" fill="#0D0F14"/><rect x="0" y="25" width="960" height="1" fill="#1F2633"/><rect x="0" y="0" width="6" height="26" fill="#FF9F1C"/><text x="16" y="18" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#FF9F1C" text-anchor="start" font-weight="700" letter-spacing="2">NIGHTGRID // INTEL</text><text x="946" y="18" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B98A9" text-anchor="end" font-weight="400" letter-spacing="2">DX-49</text><path d="M930,226 H952 V204" fill="none" stroke="#00E5FF" stroke-width="2"/><path d="M8,204 V226 H30" fill="none" stroke="#1F2633" stroke-width="2"/><rect x="120.0" y="69" width="720.0" height="2" fill="#1F2633"/><path d="M120.0,52 L138.0,70 L120.0,88 L102.0,70 Z" fill="#07080B" stroke="#00E5FF" stroke-width="2"/><text x="120.0" y="75" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#00E5FF" text-anchor="middle" font-weight="700">01</text><text x="120.0" y="116" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16" fill="#E6EDF3" text-anchor="middle" font-weight="700">Order</text><text x="120.0" y="140" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">Client asks the CA</text><text x="120.0" y="157" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">for a name</text><path d="M300.0,52 L318.0,70 L300.0,88 L282.0,70 Z" fill="#07080B" stroke="#00E5FF" stroke-width="2"/><text x="300.0" y="75" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#00E5FF" text-anchor="middle" font-weight="700">02</text><text x="300.0" y="116" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16" fill="#E6EDF3" text-anchor="middle" font-weight="700">Challenge</text><text x="300.0" y="140" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">HTTP-01 file on :80</text><text x="300.0" y="157" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">or DNS-01 TXT record</text><path d="M480.0,52 L498.0,70 L480.0,88 L462.0,70 Z" fill="#07080B" stroke="#00E5FF" stroke-width="2"/><text x="480.0" y="75" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#00E5FF" text-anchor="middle" font-weight="700">03</text><text x="480.0" y="116" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16" fill="#E6EDF3" text-anchor="middle" font-weight="700">Validate</text><text x="480.0" y="140" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">CA checks it from</text><text x="480.0" y="157" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">the internet</text><path d="M660.0,52 L678.0,70 L660.0,88 L642.0,70 Z" fill="#07080B" stroke="#00E5FF" stroke-width="2"/><text x="660.0" y="75" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#00E5FF" text-anchor="middle" font-weight="700">04</text><text x="660.0" y="116" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16" fill="#E6EDF3" text-anchor="middle" font-weight="700">Certificate</text><text x="660.0" y="140" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">Signed, valid about</text><text x="660.0" y="157" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">90 days</text><path d="M840.0,52 L858.0,70 L840.0,88 L822.0,70 Z" fill="#07080B" stroke="#FF9F1C" stroke-width="2"/><text x="840.0" y="75" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#FF9F1C" text-anchor="middle" font-weight="700">05</text><text x="840.0" y="116" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16" fill="#E6EDF3" text-anchor="middle" font-weight="700">Renew</text><text x="840.0" y="140" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">Timer renews about</text><text x="840.0" y="157" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B98A9" text-anchor="middle" font-weight="400">30 days before</text><rect x="0" y="200" width="960" height="34" fill="#0D0F14" opacity="0.92"/><text x="18" y="222" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" fill="#BDF5EC" text-anchor="start" font-weight="400">The CA checks you control the name, signs a 90-day certificate, and the client renews it early.</text></svg>
