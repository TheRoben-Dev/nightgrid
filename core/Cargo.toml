[package]
name = "nightgrid-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "nightgrid_core"

[dependencies]
age = { version = "0.11", default-features = false }
base64 = "0.23.1"
bollard = { version = "0.21", default-features = false }
bytes = "1"
futures-util = "0.3"
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
keyring = "4.2.0"
portable-pty = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7.0"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11"
specta = { version = "=2.0.0-rc.28", features = ["derive"], optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
x509-parser = "0.18"
yaml-rust2 = "0.11.1"
zeroize = "1.9.1"

[dev-dependencies]
rand = "0.10"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }

[features]
default = []
# Derive specta::Type on public types so the Tauri crate can export them to TypeScript.
specta = ["dep:specta"]
