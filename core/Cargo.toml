[package]
name = "nightgrid-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nightgrid_core"

[dependencies]
base64 = "0.23.1"
hmac = "0.13"
keyring = "4.2.0"
portable-pty = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7.0"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
specta = { version = "=2.0.0-rc.28", features = ["derive"], optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tracing = "0.1.44"
zeroize = "1.9.1"

[dev-dependencies]
rand = "0.10"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }

[features]
default = []
# Derive specta::Type on public types so the Tauri crate can export them to TypeScript.
specta = ["dep:specta"]
