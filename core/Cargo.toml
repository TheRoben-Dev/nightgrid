[package]
name = "nightgrid-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nightgrid_core"

[dependencies]
keyring = "4.2.0"
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive"], optional = true }
thiserror = "2.0.21"
tracing = "0.1.44"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []
# Derive specta::Type on public types so the Tauri crate can export them to TypeScript.
specta = ["dep:specta"]
